<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>総合クイズ｜LTE Study</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .setup { display: grid; gap: 12px; }
    .setup label.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .setup select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
    .stat-bar { display: inline-block; width: 120px; height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; vertical-align: middle; margin-right: 8px; }
    .stat-bar > span { display: block; height: 100%; }
  </style>
</head>
<body data-root="">
<div class="page">
<main>
  <header class="chapter-hero">
    <div class="eyebrow">QUIZ</div>
    <h1>総合クイズ</h1>
    <p class="lead">全章から出題します。範囲と問題数を選んで挑戦しましょう。結果は章ごとの正答率に反映されます。</p>
  </header>

  <div class="card setup">
    <div>
      <b>出題範囲</b>
      <div class="chips" id="chapters"></div>
      <div class="btn-row" style="margin:4px 0 0">
        <button class="btn" id="all">すべて選択</button>
        <button class="btn" id="none">選択解除</button>
      </div>
    </div>
    <label class="row"><b>問題数</b>
      <select id="count"><option value="10">10問</option><option value="20" selected>20問</option><option value="40">40問</option><option value="0">全問</option></select>
    </label>
    <label class="row"><input type="checkbox" id="wrong-only"> 間違えた問題・未回答の問題だけ出題する</label>
    <div><button class="btn primary" id="start">出題する</button> <span class="small muted" id="avail"></span></div>
  </div>

  <div class="quiz" id="quiz"></div>

  <h2>章ごとの成績</h2>
  <div class="table-wrap"><table id="stats"><thead><tr><th>章</th><th>正答率</th><th>回答済み</th><th></th></tr></thead><tbody></tbody></table></div>
</main>
</div>
<script src="assets/data/quiz/ch01.js"></script>
<script src="assets/data/quiz/ch02.js"></script>
<script src="assets/data/quiz/ch03.js"></script>
<script src="assets/data/quiz/chA1.js"></script>
<script src="assets/data/quiz/ch04.js"></script>
<script src="assets/data/quiz/ch05.js"></script>
<script src="assets/data/quiz/ch06.js"></script>
<script src="assets/data/quiz/ch07.js"></script>
<script src="assets/data/quiz/ch08.js"></script>
<script src="assets/data/quiz/ch09.js"></script>
<script src="assets/data/quiz/ch10.js"></script>
<script src="assets/data/quiz/ch11.js"></script>
<script src="assets/data/quiz/ch12.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  const { store, CHAPTERS, esc, shuffle, renderQuiz } = window.LTE;
  const all = window.QUIZ || [];
  const chipsBox = document.getElementById("chapters");
  let selected = new Set(store.get("quizPage.chapters", CHAPTERS.map((c) => c.id)));

  CHAPTERS.forEach((c) => {
    const n = all.filter((q) => q.ch === c.id).length;
    const b = document.createElement("button");
    b.className = "chip";
    b.dataset.ch = c.id;
    b.textContent = `${c.num || c.id} ${c.title}（${n}）`;
    b.addEventListener("click", () => { selected.has(c.id) ? selected.delete(c.id) : selected.add(c.id); sync(); });
    chipsBox.append(b);
  });

  const pool = () => {
    const results = store.get("quiz", {});
    let qs = all.filter((q) => selected.has(q.ch));
    if (document.getElementById("wrong-only").checked) qs = qs.filter((q) => !results[q.id] || !results[q.id].ok);
    return qs;
  };
  function sync() {
    chipsBox.querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-pressed", String(selected.has(b.dataset.ch))));
    store.set("quizPage.chapters", Array.from(selected));
    document.getElementById("avail").textContent = `対象 ${pool().length} 問`;
  }
  document.getElementById("all").addEventListener("click", () => { selected = new Set(CHAPTERS.map((c) => c.id)); sync(); });
  document.getElementById("none").addEventListener("click", () => { selected = new Set(); sync(); });
  document.getElementById("wrong-only").addEventListener("change", sync);

  const pick = () => {
    const n = parseInt(document.getElementById("count").value, 10);
    const qs = shuffle(pool());
    return n ? qs.slice(0, n) : qs;
  };
  document.getElementById("start").addEventListener("click", () => {
    const el = document.getElementById("quiz");
    renderQuiz(el, pick(), { reshuffle: pick, onFinish: renderStats });
    el.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  function renderStats() {
    const results = store.get("quiz", {});
    document.querySelector("#stats tbody").innerHTML = CHAPTERS.map((c) => {
      const qs = all.filter((q) => q.ch === c.id);
      const tried = qs.filter((q) => results[q.id]);
      const ok = tried.filter((q) => results[q.id].ok).length;
      const r = tried.length ? ok / tried.length : 0;
      const color = !tried.length ? "var(--border)" : r >= .8 ? "var(--ok)" : r >= .5 ? "var(--warn)" : "var(--bad)";
      return `<tr><td>${esc(window.LTE.label(c))} ${esc(c.title)}</td>
        <td><span class="stat-bar"><span style="width:${r * 100}%;background:${color}"></span></span>${tried.length ? Math.round(r * 100) + "%" : "—"}</td>
        <td>${tried.length} / ${qs.length}</td>
        <td>${tried.length && r < .7 ? `<a href="${c.file}">復習する →</a>` : ""}</td></tr>`;
    }).join("");
  }
  sync();
  renderStats();
})();
</script>
</body>
</html>
